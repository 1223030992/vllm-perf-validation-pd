# 模型 Profile: GLM-5-W8A8
# 自动生成于: 2026-05-21 10:51:19

model:
  display_name: "GLM-5-W8A8"
  short_name: "glm5int8"
  host_model_path: "/public/opendas/DL_DATA/llm-models/vllm-w8a8-models/GLM-5-W8A8"
  container_model_path: "/model/vllm-w8a8-models/GLM-5-W8A8"
  served_model_id: null
  bench_model_id: null
  precision: "int8"

resource:
  default_tp: 8
  min_gpu: 8
  default_port: 9349

service:
  script: "scripts/server-scripts/run_glm5-w8a8-server.sh"
  vllm_params:
    dtype: "bfloat16"
    gpu_memory_utilization: 0.92
    kv_cache_dtype: "fp8_ds_mla"
    max_model_len: 72000
    max_num_batched_tokens: 16384
    quantization: "slimquant_marlin"
  env_vars:
    - GPU_RANGE
    - TP_SIZE
    - MODEL_PATH
    - PORT
    - LOG_DIR
    - VLLM_USE_MODELSCOPE
    - HIP_VISIBLE_DEVICES
    - ALLREDUCE_STREAM_WITH_COMPUTE
    - NCCL_MIN_NCHANNELS
    - NCCL_MAX_NCHANNELS
    - Allgather_Base_STREAM_WITH_COMPUTE
    - SENDRECV_STREAM_WITH_COMPUTE
    - HIP_KERNEL_EVENT_SYSTENFENCE
    - VLLM_RPC_TIMEOUT
    - VLLM_REJECT_SAMPLE_OPT
    - USE_FUSED_RMS_QUANT
    - USE_FUSED_SILU_MUL_QUANT
    - VLLM_USE_GLOBAL_CACHE13
    - VLLM_FUSED_MOE_CHUNK_SIZE
    - VLLM_CUSTOM_CACHE
    - VLLM_USE_OPT_CAT
    - VLLM_USE_FUSED_FILL_RMS_CAT
    - VLLM_USE_LIGHTOP_MOE_SUM_MUL_ADD
    - VLLM_USE_LIGHTOP_RMS_ROPE_CONCAT
    - VLLM_USE_V32_ENCODE
    - USE_LIGHTOP_TOPK
    - USE_LIGHTOP_PER_TOKEN_GROUP_QUANT_FP8
    - USE_LIGHTOP_CONVERT_REQ_INDEX_TO_GLOBAL_INDEX

health_check:
  endpoint: "/v1/chat/completions"
  prompt: "你好"
  timeout_seconds: 2400
