# 模型 Profile: GLM-5.1-Channel-INT8

model:
  display_name: "GLM-5.1-Channel-INT8"
  short_name: "glm51int8"
  host_model_path: "/public4/share/GLM-5.1-Channel-INT8"
  container_model_path: "/model1/GLM-5.1-Channel-INT8"
  served_model_id: null
  bench_model_id: null
  precision: "int8"

resource:
  default_tp: 8
  min_gpu: 8
  default_port: 9350

service:
  script: "scripts/server-scripts/run_glm5.1-w8a8-server.sh"
  vllm_params:
    max_model_len: 40960
    gpu_memory_utilization: 0.92
    quantization: "slimquant_marlin"
    dtype: "bfloat16"
    max_num_batched_tokens: 16384
    kv_cache_dtype: "fp8_ds_mla"
  env_vars:
    - ALLREDUCE_STREAM_WITH_COMPUTE
    - NCCL_MIN_NCHANNELS
    - NCCL_MAX_NCHANNELS
    - VLLM_RPC_TIMEOUT
    - VLLM_USE_PD_SPLIT
    - VLLM_USE_GLOBAL_CACHE13
    - VLLM_FUSED_MOE_CHUNK_SIZE
    - VLLM_CUSTOM_CACHE

health_check:
  endpoint: "/v1/chat/completions"
  prompt: "你好"
  timeout_seconds: 1800
