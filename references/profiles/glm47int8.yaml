model:
  display_name: "GLM-4.7-W8A8"
  short_name: "glm47int8"
  host_model_path: "/public/opendas/DL_DATA/llm-models/glm4.7/GLM-4.7-W8A8"
  container_model_path: "/model/GLM-4.7-W8A8"
  served_model_id: null
  bench_model_id: null
  precision: "int8"

resource:
  default_tp: 8
  min_gpu: 8
  default_port: 9348

service:
  script: "scripts/server-scripts/run_glm47int8-server.sh"
  vllm_params:
    max_model_len: 40960
    gpu_memory_utilization: 0.9
    quantization: "slimquant_marlin"
    dtype: "bfloat16"
    max_num_seqs: 256
    max_num_batched_tokens: 40960
  env_vars:
    - VLLM_TORCH_PROFILER_DIR
    - NCCL_MIN_NCHANNELS
    - NCCL_MAX_NCHANNELS
    - NCCL_P2P_NVL_CHUNKSIZE
    - VLLM_RPC_TIMEOUT
    - VLLM_NUMA_BIND
    - VLLM_RANK0_NUMA
    - VLLM_RANK1_NUMA
    - VLLM_RANK2_NUMA
    - VLLM_RANK3_NUMA
    - VLLM_RANK4_NUMA
    - VLLM_RANK5_NUMA
    - VLLM_RANK6_NUMA
    - VLLM_RANK7_NUMA
    - VLLM_USE_GLOBAL_CACHE13
    - VLLM_FUSED_MOE_CHUNK_SIZE
    - VLLM_ZERO_OVERHEAD
    - VLLM_USE_PD_SPLIT
    - VLLM_USE_LIGHTOP
    - VLLM_USE_PIECEWISE
    - VLLM_V1_USE_FUSED_QKV_SPLIT_RMS_ROPE_KVSTORE
    - VLLM_USE_AITER_MOE_W8A8
    - VLLM_REJECT_SAMPLE_OPT

health_check:
  endpoint: "/v1/chat/completions"
  prompt: "你好"
  timeout_seconds: 300
