# 模型 Profile: Kimi-K2.5-INT4
# 自动生成于: 2026-05-22 09:59:45

model:
  display_name: "Kimi-K2.5-INT4"
  short_name: "kimik25int4"
  host_model_path: "/public/opendas/DL_DATA/llm-models/Kimi-K2.5"
  container_model_path: "/model/Kimi-K2.5"
  served_model_id: null
  bench_model_id: null
  precision: "int4"

resource:
  default_tp: 8
  min_gpu: 8
  default_port: 9354

service:
  script: "scripts/server-scripts/run_kimik2.5-int4-server.sh"
  vllm_params:
    dtype: "bfloat16"
    gpu_memory_utilization: 0.90
    kv_cache_dtype: "fp8_e4m3"
    max_model_len: 65536
    max_num_batched_tokens: 16384
  env_vars:
    - GPU_RANGE
    - TP_SIZE
    - MODEL_PATH
    - PORT
    - LOG_DIR
    - HIP_VISIBLE_DEVICES
    - VLLM_USE_MODELSCOPE
    - VLLM_USE_LIGHTOP
    - VLLM_USE_PIECEWISE
    - VLLM_1D_MROPE
    - USE_FUSED_RMS_QUANT
    - VLLM_USE_LIGHTOP_FUSED_TOPP_TOPK
    - VLLM_W8A8_BACKEND
    - VLLM_USE_FLASH_ATTN_FP8
    - VLLM_USE_CAT_MLA
    - VLLM_USE_LIGHTOP_RMS_ROPE_CONCAT
    - VLLM_ROCM_USE_AITER_MOE

health_check:
  endpoint: "/v1/chat/completions"
  prompt: "你好"
  timeout_seconds: 2400
