pd_profile:
  name: glm47-vllm018-mooncake
  description: GLM-4.7 vLLM 0.18 Mooncake 1P1D defaults from the reference runbook.

model:
  name: GLM-4.7-W8A8
  model_short: glm47int8
  host_model_path: /public/opendas/DL_DATA/llm-models/glm4.7/GLM-4.7-W8A8
  container_model_path: /model/GLM-4.7-W8A8
  precision: int8

pd:
  backend: mooncake_vllm018
  topology: 1p1d
  mooncake_proxy_script: mooncake/examples/online_serving/disaggregated_serving/mooncake_connector/mooncake_connector_proxy.py
  service_defaults:
    tp: 8
    gpu_range: "0,1,2,3,4,5,6,7"
    quantization: slimquant_marlin
    dtype: bfloat16
    max_num_batched_tokens: 16384
    max_num_seqs: 256
    gpu_memory_utilization: 0.9
    max_model_len: 40960
    speculative_config: '{"method": "mtp", "num_speculative_tokens": 2, "quantization": "slimquant_marlin"}'
    compilation_config: '{"cudagraph_mode": "PIECEWISE"}'
  network:
    ifname: ens19f0
    nccl_ib_hca: mlx5_2,mlx5_3,mlx5_4,mlx5_5,mlx5_6,mlx5_8,mlx5_9
